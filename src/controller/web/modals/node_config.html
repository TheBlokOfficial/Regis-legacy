<!-- MODAL ZDALNEJ KONFIGURACJI KLIENTA -->
<div id="node-config-modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-node-title">Konfiguracja RegisDesktop</h2>
            <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        </div>
        <form id="node-config-form">
            <input type="hidden" id="modal-node-id">

            <div class="form-group">
                <label for="modal-node-name">Nazwa RegisDesktop / Alias:</label>
                <input type="text" id="modal-node-name" placeholder="np. Komputer w Salonie">
            </div>

            <div class="config-section">
                <div class="config-section-title">
                    <input type="checkbox" id="modal-enable-ollama">
                    <label for="modal-enable-ollama"><strong> Usługa LLM Worker (Ollama)</strong></label>
                </div>
                <div id="ollama-config-fields" class="config-section-body" style="display:none">
                    <div class="form-group">
                        <label for="modal-worker-model">Nazwa Modelu Ollama (np. qwen3.5:27b, qwen3.5:9b):</label>
                        <input type="text" id="modal-worker-model" list="suggested-models-list" placeholder="np. qwen3.5:27b" style="width:100%">
                        <datalist id="suggested-models-list">
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label for="modal-worker-priority">Priorytet mocy maszyny (1-100):</label>
                        <input type="number" id="modal-worker-priority" min="1" max="100" value="100">
                    </div>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-title">
                    <input type="checkbox" id="modal-enable-stt">
                    <label for="modal-enable-stt"><strong> Usługa Transkrypcji Mowy (STT Worker)</strong></label>
                </div>
                <div id="stt-config-fields" class="config-section-body" style="display:none">
                    <div class="form-group">
                        <label for="modal-stt-size">Rozmiar modelu Faster-Whisper:</label>
                        <select id="modal-stt-size" class="sat-select" style="width:100%">
                            <option value="tiny">tiny (najszybszy)</option>
                            <option value="base">base</option>
                            <option value="small" selected>small (zalecany)</option>
                            <option value="medium">medium</option>
                            <option value="large-v3">large-v3 (najdokładniejszy)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="modal-stt-lang">Język transkrypcji:</label>
                        <input type="text" id="modal-stt-lang" value="pl" placeholder="pl">
                    </div>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-title">
                    <input type="checkbox" id="modal-enable-tts">
                    <label for="modal-enable-tts"><strong> Usługa Syntezy Mowy (TTS Worker)</strong></label>
                </div>
                <div id="tts-config-fields" class="config-section-body" style="display:none">
                    <div class="form-group">
                        <label for="modal-tts-model">Identyfikator modelu głosu Piper:</label>
                        <input type="text" id="modal-tts-model" value="pl_PL-darkman-medium" placeholder="pl_PL-darkman-medium">
                    </div>
                </div>
            </div>

            <div class="config-section">
                <div class="config-section-title">
                    <input type="checkbox" id="modal-enable-satellite">
                    <label for="modal-enable-satellite"><strong> Usługa Satelita (Audio &amp; VAD)</strong></label>
                </div>
                <div id="satellite-config-fields" class="config-section-body" style="display:none">
                    <div class="form-group">
                        <label for="modal-satellite-room">Przypisane Pomieszczenie (Pokój):</label>
                        <input type="text" id="modal-satellite-room" placeholder="np. salon, pracownia_glowna">
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn" id="modal-cancel-btn">Anuluj</button>
                <button type="submit" class="btn active" id="modal-save-btn">Zapisz Zmiany</button>
            </div>
        </form>
    </div>
</div>
