<!-- MODAL KONFIGURACJI DOSTAWCY CHMUROWEGO -->
<div id="cloud-provider-modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-cp-title">Dostawca LLM (Chmura)</h2>
            <button class="modal-close-btn" id="modal-cp-close-btn">&times;</button>
        </div>
        <form id="cloud-provider-form">
            <input type="hidden" id="modal-cp-id">

            <div class="form-group">
                <label for="modal-cp-type">Platforma / Typ:</label>
                <select id="modal-cp-type" class="sat-select" style="width:100%" required>
                    <option value="openrouter">OpenRouter</option>
                    <option value="groq">Groq (Przyszłość)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="modal-cp-key">Klucz API:</label>
                <input type="password" id="modal-cp-key" placeholder="Wklej klucz API">
                <small style="color: var(--text-dim); display: block; margin-top: 4px;">Zostaw puste, by nie zmieniać (przy edycji).</small>
            </div>

            <div class="form-group">
                <label for="modal-cp-model">Identyfikator Modelu:</label>
                <input type="text" id="modal-cp-model" placeholder="np. qwen/qwen-2.5-72b-instruct" required>
            </div>

            <div class="form-group">
                <label for="modal-cp-priority">Priorytet (1-100):</label>
                <input type="number" id="modal-cp-priority" min="1" max="100" value="50" required>
            </div>

            <div class="modal-actions" style="justify-content: space-between; display: flex; width: 100%;">
                <button type="button" class="btn danger" id="modal-cp-delete-btn" style="display:none;">Usuń</button>
                <div>
                    <button type="button" class="btn" id="modal-cp-cancel-btn">Anuluj</button>
                    <button type="submit" class="btn active">Zapisz</button>
                </div>
            </div>
        </form>
    </div>
</div>
