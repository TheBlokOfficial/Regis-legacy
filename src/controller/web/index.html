<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reaktywny panel kontrolny systemu Regis — monitorowanie węzłów, satelit i dziennik zdarzeń na żywo.">
    <title>Regis — Panel Kontrolny</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

    <!-- LEWY PANEL BOCZNY -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>REGIS</h1>
            <span id="clock" aria-live="polite"></span>
        </div>
        
        <nav class="sidebar-nav">
            <button class="nav-btn active" data-view="dashboard">Pulpit (Status)</button>
            <button class="nav-btn" data-view="logs">Dziennik Zdarzeń</button>
            <button class="nav-btn" data-view="chat">Czat &amp; Konwersacje</button>
        </nav>
        
        <div class="sidebar-footer">
            <div class="status-item sse-indicator">
                <span class="dot" id="sse-dot" style="background:var(--text-dim)"></span>
                <span class="label" id="sse-status">łączenie&hellip;</span>
            </div>
        </div>
    </aside>

    <!-- GŁÓWNA ZAWARTOŚĆ -->
    <main id="main">
        <!-- Komponenty widoków (dashboard.html, logs.html, chat.html) ładowane dynamicznie z /views/ -->
    </main>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
</div>

<!-- Komponenty okien modalnych (node_config.html, cloud_provider.html) ładowane dynamicznie z /modals/ -->

<script type="module" src="/app.js"></script>
</body>
</html>
