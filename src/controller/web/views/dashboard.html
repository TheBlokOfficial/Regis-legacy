<!-- ZAKŁADKA 1: DASHBOARD -->
<section id="view-dashboard" class="view-section active">
    <div class="view-header">
        <h2>Pulpit Systemu</h2>
    </div>

    <div class="status-strip">
        <div class="strip-stat">
            <span class="strip-label">Uptime</span>
            <span class="strip-value" id="uptime">—</span>
        </div>
        <div class="strip-divider"></div>
        <div class="strip-stat">
            <span class="strip-label">Agent (LLM)</span>
            <span class="strip-value" id="providers-count">0</span>
        </div>
        <div class="strip-divider"></div>
        <div class="strip-stat">
            <span class="strip-label">Satelity</span>
            <span class="strip-value" id="satellite-count">0</span>
        </div>
        <div class="strip-divider"></div>
        <div class="strip-stat">
            <span class="strip-label">Integracje</span>
            <span class="strip-value" id="integration-count">0</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Kafelek 1: Agent & Kanał Audio -->
        <div class="dashboard-card-section">
            <div class="dashboard-section-header">
                <h3>Agent &amp; Kanał Audio</h3>
                <button class="btn btn-ghost" id="add-cloud-provider-btn">+ Dodaj Dostawcę LLM</button>
            </div>

            <div class="list-container" id="providers-tree-body">
                <div class="empty-state">Brak skonfigurowanego dostawcy.</div>
            </div>
        </div>

        <!-- Kafelek 2: Satelity -->
        <div class="dashboard-card-section">
            <div class="dashboard-section-header">
                <h3>Satelity</h3>
            </div>
            <div class="list-container" id="satellites-tree-body">
                <div class="empty-state">Brak zarejestrowanych satelitów.</div>
            </div>
        </div>

        <!-- Kafelek 3: Integracje -->
        <div class="dashboard-card-section">
            <div class="dashboard-section-header">
                <h3>Integracje</h3>
            </div>
            <div class="list-container" id="integrations-tree-body">
                <div class="empty-state">Brak aktywnych integracji. Uruchom Home Assistant lub inną integrację, aby ją tutaj zobaczyć.</div>
            </div>
        </div>
    </div>
</section>
